      </ul>
    </nav>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <h1>Formulario de solicitud</h1>

    <form id="formulario" action="#" method="post" novalidate>
      
      <!--Usaremos un fieldset para agrupar los campos el formulario-->
      <!--Solicitamos datos de contacto-->
      <fieldset>
        <legend>Datos de contacto</legend>

        <div class="campo">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
          <span class="error" id="error-nombre"></span>
        </div>
        <div class="campo">
          <label for="apellidos">Apellidos:</label>
          <input type="text" id="apellidos" name="apellidos" placeholder="Escribe tus apellidos" required>
          <span class="error" id="error-apellidos"></span>
        </div>
        <div class="campo">
          <label for="telefono">Teléfono de contacto:</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Escribe tu número de teléfono" required>
          <span class="error" id="error-telefono"></span>
        </div>
        <div class="campo">
          <label for="email">Correo electrónico:</label>
          <input type="text" id="email" name="email" placeholder="nombre@dominio.com" required>
          <span class="error" id="error-email"></span>
        </div>
      </fieldset>

      <!--Presupuesto-->
      <fieldset>
        <legend>Presupuesto</legend>

        <!--Presupuesto:Por edad-->
        <div class="campo">
          <label for="producto">Elige tu edad:</label>
          <select id="producto" name="producto" required>
            <option value="" data-precio="0">Selecciona una opción</option>
            <option value="kids" data-precio="40">Kids (6-11 años) - 40€/mes</option>
            <option value="teens" data-precio="50">Teen (12-17 años) - 50€/mes</option>
            <option value="adults" data-precio="60">Adults (18+ años) - 60€/mes</option>
          </select>
          <span class="error" id="error-producto"></span>
        </div>

        <!--Modalidad (Grupal o individual):Multiplicar precio-->
        <fieldset class="grupo">
          <legend>Modalidad:</legend>
          <label for="grupal">
            <input type="radio" id="grupal" name="modalidad" value="grupal" data-factor="1" checked>
            Clases grupales
          </label>
          <label for="individual">
            <input type="radio" id="individual" name="modalidad" value="individual" data-factor="2">
            Clases individuales (x2)
          </label>
        </fieldset>

        <!--Plazo: duración-->
        <div class="campo">
          <label for="plazo">Plazo en meses (1-12):</label>
          <input type="number" id="plazo" name="plazo" min="1" max="12" value="1" required>
        </div>

        <!--Extras: casillas que suman al importe final-->

        <fieldset class="grupo">
          <legend>Elige tus extras:</legend>
          <label for="extra-diccionario">
            <input type="checkbox" id="extra-diccionario" name="extras" value="diccionario" data-precio="15">
            Diccionario (15€)
          </label>
          <label for="extra-cuaderno">
            <input type="checkbox" id="extra-cuaderno" name="extras" value="cuaderno" data-precio="8">
            Pack de cuadernos (8€)
          </label>
          <label for="extra-lapices">
            <input type="checkbox" id="extra-lapices" name="extras" value="lapices" data-precio="5">
            Pack de lápices (5€)
          </label>
          <label for="extra-digital">
            <input type="checkbox" id="extra-digital" name="extras" value="digital" data-precio="10">
            Material digital (10€)
          </label>
        </fieldset>

        <!--Total: se actualizará con JavaScript-->
        <p class="total">
          Total: <output id="total" for="producto grupal individual plazo extra-diccionario extra-cuaderno extra-lapices extra-digital">0€</output>
        </p>

      </fieldset>

      <!--Condiciones y envió-->
      <fieldset>
        <legend>Aceptación de las condiciones y envío</legend>
        
        <label for="privacidad">
          <input type="checkbox" id="privacidad" name="privacidad" required>He leído la <a href="../views/aviso-legal.html" target="_blank" rel="noopener">política de privacidad</a>
        </label>
        <span class="error" id="error-privacidad"></span>
        
        <div class="botones">
          <button type="submit" class="boton">Enviar formulario</button>
          <button type="reset" class="boton boton-secundario">Borrar formulario</button>
        </div>
      </fieldset>

    </form>
  </main>
